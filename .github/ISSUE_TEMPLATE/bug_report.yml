name: Bug report
description: Something in CriteriaIQ doesn't work as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't include passwords, API keys, customer data or other private information. Report security vulnerabilities privately (see SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CriteriaIQ version
      description: Shown under the logo in the sidebar, or in version.json.
      placeholder: v0.11.84
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Docker Compose
        - Dokploy / Coolify
        - Native (Node.js)
        - Local development (npm run dev)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server log lines or browser console errors. Remove any secrets first.
      render: shell
