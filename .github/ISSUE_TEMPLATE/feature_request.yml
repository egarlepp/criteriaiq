name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected and what they can't do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mockups or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Projects and MAP
        - Success criteria and outcomes
        - Account portal
        - Integrations (CRM, SSO, n8n, AI)
        - Email and notifications
        - Reports
        - Administration and setup
        - Localization
        - Other
